<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Nihal Patel system status</title>
  <desc id="desc">An animated developer dashboard showing research, current build, technical range, and engineering principle.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #8b949e; } .text { fill: #c9d1d9; } .bright { fill: #f0f6fc; }
    .green { fill: #7ee787; } .blue { fill: #79c0ff; } .purple { fill: #d2a8ff; } .orange { fill: #ffa657; }
    .card { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    .c1 { animation-delay: .1s; } .c2 { animation-delay: .24s; } .c3 { animation-delay: .38s; } .c4 { animation-delay: .52s; }
    .dot { transform-origin: center; animation: ping 2s ease-in-out infinite; }
    .dash { stroke-dasharray: 7 9; animation: dash 8s linear infinite; }
    .ticker { animation: ticker 10s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ping { 0%,100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes dash { to { stroke-dashoffset: -160; } }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(550px); } }
    @media (prefers-reduced-motion: reduce) { .card, .dot, .dash, .ticker { animation: none !important; opacity: 1; transform: none; } }
  </style>
  <rect x="1" y="1" width="1198" height="278" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="43" rx="12 12 0 0" fill="#161b22"/>
  <circle cx="24" cy="23" r="6" fill="#ff7b72"/><circle cx="45" cy="23" r="6" fill="#f2cc60"/><circle cx="66" cy="23" r="6" fill="#3fb950"/>
  <text x="91" y="28" class="mono" font-size="13" fill="#8b949e">runtime.monitor</text>
  <circle cx="1078" cy="22" r="5" fill="#3fb950" class="dot"/>
  <text x="1092" y="27" class="mono" font-size="12" fill="#7ee787">ONLINE</text>

  <g class="card c1">
    <rect x="24" y="65" width="271" height="151" rx="8" fill="#0b0f14" stroke="#21262d"/>
    <text x="43" y="91" class="mono muted" font-size="12">01 // RESEARCH</text>
    <text x="43" y="125" class="ui bright" font-size="19" font-weight="700">VR + Eye Tracking</text>
    <text x="43" y="151" class="mono text" font-size="13">Attention-aware geometry</text>
    <line x1="43" y1="172" x2="276" y2="172" stroke="#21262d"/>
    <circle cx="49" cy="195" r="5" fill="#3fb950"/><text x="64" y="200" class="mono green" font-size="12">RESEARCH COMPLETE</text>
  </g>

  <g class="card c2">
    <rect x="309" y="65" width="271" height="151" rx="8" fill="#0b0f14" stroke="#21262d"/>
    <text x="328" y="91" class="mono muted" font-size="12">02 // CURRENT BUILD</text>
    <text x="328" y="125" class="ui bright" font-size="19" font-weight="700">OrbiT Runtime</text>
    <text x="328" y="151" class="mono text" font-size="13">Adaptive agent execution</text>
    <line x1="328" y1="172" x2="561" y2="172" stroke="#21262d"/>
    <circle cx="334" cy="195" r="5" fill="#d2a8ff" class="dot"/><text x="349" y="200" class="mono purple" font-size="12">ARCHITECTING</text>
  </g>

  <g class="card c3">
    <rect x="594" y="65" width="271" height="151" rx="8" fill="#0b0f14" stroke="#21262d"/>
    <text x="613" y="91" class="mono muted" font-size="12">03 // TECH RANGE</text>
    <text x="613" y="125" class="ui bright" font-size="19" font-weight="700">Systems × Intelligence</text>
    <text x="613" y="151" class="mono text" font-size="13">AI · Cloud · CV · XR</text>
    <line x1="613" y1="172" x2="846" y2="172" stroke="#21262d"/>
    <circle cx="619" cy="195" r="5" fill="#58a6ff"/><text x="634" y="200" class="mono blue" font-size="12">EXPANDING</text>
  </g>

  <g class="card c4">
    <rect x="879" y="65" width="297" height="151" rx="8" fill="#0b0f14" stroke="#21262d"/>
    <text x="898" y="91" class="mono muted" font-size="12">04 // PRINCIPLE</text>
    <text x="898" y="125" class="ui bright" font-size="19" font-weight="700">Useful Work / Compute</text>
    <text x="898" y="151" class="mono text" font-size="13">build → measure → improve</text>
    <line x1="898" y1="172" x2="1157" y2="172" stroke="#21262d"/>
    <circle cx="904" cy="195" r="5" fill="#ffa657"/><text x="919" y="200" class="mono orange" font-size="12">QUALITY GATED</text>
  </g>

  <line x1="24" y1="239" x2="1176" y2="239" stroke="#30363d" class="dash"/>
  <rect x="24" y="249" width="134" height="4" rx="2" fill="#58a6ff" class="ticker"/>
  <text x="24" y="269" class="mono muted" font-size="11">[OK] RESEARCH   [OK] PROJECTS   [RUN] ORBIT   [LOAD] CLOUD   [LOAD] ML/CV</text>
</svg>
