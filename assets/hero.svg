<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Nihal Patel developer terminal</title>
  <desc id="desc">A hand-coded terminal introducing Nihal Patel and his focus on AI systems, cloud, computer vision, and spatial computing.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: #3fb950; font-size: 19px; font-weight: 700; }
    .command { fill: #c9d1d9; font-size: 19px; }
    .value { fill: #f0f6fc; font-size: 21px; font-weight: 700; }
    .muted { fill: #8b949e; font-size: 16px; }
    .blue { fill: #58a6ff; }
    .purple { fill: #d2a8ff; }
    .orange { fill: #f2cc60; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="1198" height="328" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M13 1h1174a12 12 0 0 1 12 12v43H1V13A12 12 0 0 1 13 1Z" fill="#161b22"/>
  <line x1="1" y1="56" x2="1199" y2="56" stroke="#30363d" stroke-width="2"/>
  <circle cx="29" cy="29" r="7" fill="#ff7b72"/>
  <circle cx="53" cy="29" r="7" fill="#f2cc60"/>
  <circle cx="77" cy="29" r="7" fill="#3fb950"/>
  <text x="600" y="35" text-anchor="middle" class="mono muted">nihal@github — ~/profile</text>
  <g class="mono">
    <text x="42" y="94" class="prompt">$</text>
    <text x="67" y="94" class="command">whoami</text>
    <text x="42" y="125" class="value">Nihal Patel</text>
    <text x="42" y="168" class="prompt">$</text>
    <text x="67" y="168" class="command">cat focus.txt</text>
    <text x="42" y="200" class="muted"><tspan class="blue">AI systems</tspan><tspan>  •  </tspan><tspan class="purple">cloud engineering</tspan><tspan>  •  </tspan><tspan class="orange">computer vision</tspan><tspan>  •  spatial computing</tspan></text>
    <text x="42" y="244" class="prompt">$</text>
    <text x="67" y="244" class="command">./next-build --mode adaptive</text>
    <text x="42" y="276" class="muted">OrbiT: exploring efficient, verifiable multi-agent execution</text>
    <text x="42" y="310" class="prompt">$</text>
    <rect x="67" y="292" width="11" height="21" rx="1" fill="#58a6ff" class="cursor"/>
  </g>
  <g transform="translate(955 81)" class="mono">
    <rect width="202" height="204" rx="8" fill="#0a0e14" stroke="#21262d"/>
    <text x="18" y="31" fill="#8b949e" font-size="14">SYSTEM STATUS</text>
    <line x1="18" y1="43" x2="184" y2="43" stroke="#21262d"/>
    <circle cx="25" cy="71" r="5" fill="#3fb950"/><text x="39" y="76" fill="#c9d1d9" font-size="14">research</text><text x="184" y="76" text-anchor="end" fill="#3fb950" font-size="13">COMPLETE</text>
    <circle cx="25" cy="105" r="5" fill="#58a6ff"/><text x="39" y="110" fill="#c9d1d9" font-size="14">learning</text><text x="184" y="110" text-anchor="end" fill="#58a6ff" font-size="13">ACTIVE</text>
    <circle cx="25" cy="139" r="5" fill="#d2a8ff"/><text x="39" y="144" fill="#c9d1d9" font-size="14">building</text><text x="184" y="144" text-anchor="end" fill="#d2a8ff" font-size="13">ACTIVE</text>
    <text x="18" y="181" fill="#8b949e" font-size="12">UC · COMPUTER SCIENCE</text>
  </g>
</svg>
