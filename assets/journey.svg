<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Nihal Patel's Computer Science Journey</title>
  <desc id="desc">A timeline from Nirma University to the University of Cincinnati, Digital Futures research, and current AI systems work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eaf4fb"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a6cf"/>
      <stop offset="0.6" stop-color="#377dff"/>
      <stop offset="1" stop-color="#7c5ce7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2a5875" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="240" rx="24" fill="url(#bg)"/>
  <text x="52" y="48" fill="#15324a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">THE JOURNEY SO FAR</text>
  <line x1="110" y1="128" x2="1090" y2="128" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(145 128)" filter="url(#shadow)">
      <circle r="28" fill="#ffffff" stroke="#16a6cf" stroke-width="5"/>
      <circle r="8" fill="#16a6cf"/>
      <text x="0" y="-52" text-anchor="middle" fill="#197f9d" font-size="13" font-weight="800">2023</text>
      <text x="0" y="66" text-anchor="middle" fill="#15324a" font-size="16" font-weight="800">Nirma University</text>
      <text x="0" y="88" text-anchor="middle" fill="#627d91" font-size="12">CS foundations</text>
    </g>
    <g transform="translate(445 128)" filter="url(#shadow)">
      <circle r="28" fill="#ffffff" stroke="#2c91ef" stroke-width="5"/>
      <circle r="8" fill="#2c91ef"/>
      <text x="0" y="-52" text-anchor="middle" fill="#2678c7" font-size="13" font-weight="800">2025</text>
      <text x="0" y="66" text-anchor="middle" fill="#15324a" font-size="16" font-weight="800">University of Cincinnati</text>
      <text x="0" y="88" text-anchor="middle" fill="#627d91" font-size="12">Transferred into BS Computer Science</text>
    </g>
    <g transform="translate(755 128)" filter="url(#shadow)">
      <circle r="28" fill="#ffffff" stroke="#5376f3" stroke-width="5"/>
      <circle r="8" fill="#5376f3"/>
      <text x="0" y="-52" text-anchor="middle" fill="#4d61c6" font-size="13" font-weight="800">SUMMER 2026</text>
      <text x="0" y="66" text-anchor="middle" fill="#15324a" font-size="16" font-weight="800">Digital Futures Research</text>
      <text x="0" y="88" text-anchor="middle" fill="#627d91" font-size="12">VR, eye tracking and adaptive geometry</text>
    </g>
    <g transform="translate(1050 128)" filter="url(#shadow)">
      <circle r="31" fill="#ffffff" stroke="#7c5ce7" stroke-width="5"/>
      <circle r="9" fill="#7c5ce7"/>
      <text x="0" y="-52" text-anchor="middle" fill="#6a51bd" font-size="13" font-weight="800">NOW</text>
      <text x="0" y="66" text-anchor="middle" fill="#15324a" font-size="16" font-weight="800">AI Systems + Cloud</text>
      <text x="0" y="88" text-anchor="middle" fill="#627d91" font-size="12">Building the next layer</text>
    </g>
  </g>
</svg>
